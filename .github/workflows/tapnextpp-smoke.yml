name: TAPNext++ checkpoint smoke

on:
  workflow_dispatch:
    inputs:
      forward:
        description: Run two synthetic frames after loading the checkpoint
        required: false
        default: false
        type: boolean
      expected_checkpoint_sha256:
        description: Optional SHA-256 required for the official checkpoint
        required: false
        default: ''
        type: string

concurrency:
  group: tapnextpp-checkpoint-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CHECKPOINT_URL: https://storage.googleapis.com/gresearch/tapnextpp/tapnextpp_512.ckpt
      CHECKPOINT_DIR: /tmp/tapnextpp-checkpoint-${{ github.run_id }}
      REPORT_DIR: artifacts/tapnextpp-smoke
      RUN_FORWARD: ${{ inputs.forward }}
      EXPECTED_CHECKPOINT_SHA256: ${{ inputs.expected_checkpoint_sha256 }}
    steps:
      - name: Check out reviewed source archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Record runner resources
        run: |
          set -euo pipefail
          python --version
          printf '\n=== CPU ===\n'
          nproc
          printf '\n=== Memory ===\n'
          free -h
          printf '\n=== Disk before download ===\n'
          df -h /tmp .

      - name: Install pinned CPU inference dependencies
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          if ! python -m pip install --upgrade pip \
              --disable-pip-version-check \
              -r reels-studio/tapnextpp/requirements-smoke.txt \
              > "$REPORT_DIR/pip.log" 2>&1; then
            cat "$REPORT_DIR/pip.log"
            {
              echo '### Dependency installation failed'
              echo '```text'
              tail -80 "$REPORT_DIR/pip.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tail -25 "$REPORT_DIR/pip.log"

      - name: Download official TAPNext++ 512 checkpoint
        run: |
          set -euo pipefail
          mkdir -p "$CHECKPOINT_DIR" "$REPORT_DIR"
          checkpoint="$CHECKPOINT_DIR/tapnextpp_512.ckpt"
          curl --fail --location \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --connect-timeout 30 \
            --continue-at - \
            --output "$checkpoint.part" \
            "$CHECKPOINT_URL"
          mv "$checkpoint.part" "$checkpoint"
          test "$(stat -c %s "$checkpoint")" -gt 1000000
          ls -lh "$checkpoint"
          sha256sum "$checkpoint"

      - name: Verify source and load checkpoint
        run: |
          set -euo pipefail
          args=(
            --source-zip tapnet-main.zip
            --checkpoint "$CHECKPOINT_DIR/tapnextpp_512.ckpt"
            --checkpoint-url "$CHECKPOINT_URL"
            --resolution 512
            --threads 4
            --output "$REPORT_DIR/report.json"
          )
          if [[ "$RUN_FORWARD" == 'true' ]]; then
            args+=(--forward)
          fi
          if [[ -n "$EXPECTED_CHECKPOINT_SHA256" ]]; then
            args+=(--expected-checkpoint-sha256 "$EXPECTED_CHECKPOINT_SHA256")
          fi
          python reels-studio/tapnextpp/smoke_checkpoint.py "${args[@]}"

      - name: Add result to job summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$REPORT_DIR/report.json" ]]; then
            {
              echo '### TAPNext++ smoke report'
              echo '```json'
              cat "$REPORT_DIR/report.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload small diagnostic files only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tapnextpp-smoke-${{ github.run_id }}
          path: |
            artifacts/tapnextpp-smoke/*.json
            artifacts/tapnextpp-smoke/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Delete checkpoint and show remaining disk space
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${CHECKPOINT_DIR:?}"
          test ! -e "$CHECKPOINT_DIR"
          df -h /tmp .
          if [[ -d "$REPORT_DIR" ]]; then
            find "$REPORT_DIR" -maxdepth 1 -type f -printf '%f %s bytes\n'
          fi
