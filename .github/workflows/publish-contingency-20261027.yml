name: Publish contingency backup 2026-10-27

on:
  push:
    paths:
      - '.github/workflows/publish-contingency-20261027.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/arena/09635ca6-principaledi-o'
    runs-on: ubuntu-latest
    env:
      RELEASE: backup-contingencia-20261027
      BASE_URL: https://8080-imcd658rjencks30jkmvt.e2b.app
      ZIP_NAME: PRINCIPALEDI-O-CONTINGENCIA-20261027.zip
      EXPECTED_SIZE: '858486103'
      EXPECTED_SHA256: 26eaacf774abacc8e56ce9f9c9a16fedb3f7916d5928aaa0279a7b71d2419fd6
    steps:
      - name: Download and validate contingency assets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contingency"
          cd "$RUNNER_TEMP/contingency"
          for file in "$ZIP_NAME" "$ZIP_NAME.sha256" LEIA-ME.md TESTE-DE-RESTAURACAO.txt; do
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$file" "$BASE_URL/$file"
          done
          echo "$EXPECTED_SHA256  $ZIP_NAME" | sha256sum -c -
          test "$(stat -c %s "$ZIP_NAME")" = "$EXPECTED_SIZE"
          unzip -tq "$ZIP_NAME"

      - name: Upload and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/contingency"
          gh release upload "$RELEASE" \
            "$ZIP_NAME" "$ZIP_NAME.sha256" LEIA-ME.md TESTE-DE-RESTAURACAO.txt \
            --repo "$GITHUB_REPOSITORY"
          actual_size=$(gh release view "$RELEASE" \
            --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"$ZIP_NAME\") | .size")
          test "$actual_size" = "$EXPECTED_SIZE"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --draft=false
